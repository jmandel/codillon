<!DOCTYPE html>
<html>
  <head>
    <link data-trunk rel="css" href="public/codillon.css"/>
    <link data-trunk rel="copy-dir" href="public/fonts"/>
    <link data-trunk rel="copy-dir" href="public/examples"/>
    <link data-trunk rel="copy-dir" href="public/z3"/>
    <link data-trunk rel="icon" href="public/favicon.ico" type="image/x-icon">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Codillon</title>
    <script>
      // Embed mode (#...&embed=1): mark the document, keep the parent frame informed of our
      // height, and (fit=1, the default for embeds narrower than 700 px) scale the whole
      // editor to the frame's width with CSS zoom (falling back to a transform).
      (function () {
        var de = document.documentElement;
        function param(name) {
          var m = location.hash.match(new RegExp("(?:^#|&)" + name + "=([^&]*)"));
          return m ? m[1] : null;
        }
        function isEmbed() { return param("embed") === "1"; }
        function wantFit() {
          var f = param("fit");
          if (f !== null) return f === "1";
          return isEmbed() && window.innerWidth < 700;
        }
        var zoomOK = window.CSS && CSS.supports && CSS.supports("zoom", "1");
        var scale = 1;
        function setScale(z) {
          scale = z;
          if (zoomOK) {
            de.style.zoom = z === 1 ? "" : String(z);
          } else if (document.body) {
            var b = document.body.style;
            b.transformOrigin = "0 0";
            b.transform = z === 1 ? "" : "scale(" + z + ")";
            b.width = z === 1 ? "" : (100 / z) + "%";
          }
        }
        var fitting = false;
        function fit() {
          if (fitting) return;
          fitting = true;
          if (!wantFit()) {
            if (scale !== 1) setScale(1);
          } else {
            setScale(1); // measure the editor at its natural size
            var natural = Math.max(de.scrollWidth, document.body ? document.body.scrollWidth : 0);
            var z = Math.min(1, window.innerWidth / Math.max(natural, 1));
            setScale(Math.floor(z * 1000) / 1000);
          }
          fitting = false;
        }
        var last = -1;
        function post() {
          if (!isEmbed() || window.parent === window) return;
          // the height the parent must give the frame, after scaling
          var h = document.body
            ? document.body.getBoundingClientRect().bottom
            : de.getBoundingClientRect().height;
          if (!zoomOK && scale !== 1 && document.body) {
            h = document.body.offsetHeight * scale;
          }
          h = Math.ceil(Math.max(h, zoomOK || scale === 1 ? de.scrollHeight * (zoomOK ? 1 : scale) : 0));
          if (h !== last) {
            last = h;
            window.parent.postMessage({ type: "codillon-height", height: h }, "*");
          }
        }
        var queued = false;
        function update() {
          if (queued) return;
          queued = true;
          requestAnimationFrame(function () {
            queued = false;
            fit();
            post();
          });
        }
        function apply() {
          de.classList.toggle("embed", isEmbed());
          update();
        }
        apply();
        window.addEventListener("hashchange", apply);
        window.addEventListener("resize", update);
        window.addEventListener("load", update);
        var ro = new ResizeObserver(update);
        ro.observe(de);
        document.addEventListener("DOMContentLoaded", function () {
          ro.observe(document.body);
          new MutationObserver(update)
            .observe(document.body, { childList: true, subtree: true, attributes: true, attributeFilter: ["height", "class"] });
        });
      })();
    </script>
  </head>
  <body></body>
</html>
